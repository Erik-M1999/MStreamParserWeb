name: Deploy to Hetzner

# Deploys on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; a newer push supersedes an in-flight one.
concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Password-based SSH to konsoleH via sshpass — no marketplace action, so
      # nothing new enters the supply chain.
      #
      # konsoleH's interactive SSH is on PORT 222 (port 22 accepts the password
      # but refuses every session channel — that's what "exec/shell/PTY request
      # failed" meant). We pass no command and pipe the build script into the
      # login shell's stdin: the shell is a login shell (profile sourced → node
      # on PATH) but non-interactive (stdin is a pipe, not a TTY), so
      # `set -euo pipefail` in the script still aborts on error.
      - name: Deploy over SSH
        env:
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.HETZNER_SSH_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASSWORD" ssh -p 222 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" < deploy/hetzner-deploy.sh
