name: Deploy to Hetzner

# Deploys on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; a newer push supersedes an in-flight one.
concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Password-based SSH to konsoleH via sshpass — no marketplace action, so
      # nothing new enters the supply chain.
      #
      # konsoleH's shared hosting blocks the SSH "exec" channel and refuses a
      # shell session without a PTY, so we force a PTY (-tt). That makes the
      # login shell interactive, and interactive bash IGNORES `set -e` — so we
      # immediately hand off to a non-interactive inner `bash` fed our script as
      # a quoted heredoc. There `set -euo pipefail` aborts on error, and its exit
      # code is propagated back out so a failed step fails the workflow.
      # (Login shell → profile sourced → node/npm/npx on PATH.)
      - name: Deploy over SSH
        env:
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.HETZNER_SSH_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          {
            echo "bash <<'MSP_DEPLOY_EOF'"
            cat deploy/hetzner-deploy.sh
            echo "MSP_DEPLOY_EOF"
            echo 'RC=$?; exit $RC'
          } | sshpass -p "$SSH_PASSWORD" ssh -tt \
                -o StrictHostKeyChecking=accept-new \
                "$SSH_USER@$SSH_HOST"
