name: Deploy to Hetzner

# Deploys on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; a newer push supersedes an in-flight one.
concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Password-based SSH to konsoleH via sshpass — no marketplace action, so
      # nothing new enters the supply chain.
      #
      # NB: we pass NO command. konsoleH's shared hosting blocks the SSH "exec"
      # request (running `some-command` over SSH → "exec request failed"), but
      # allows the plain login shell — the same one an interactive login uses.
      # Piping the script into that shell's stdin runs it non-interactively
      # (so `set -e` still aborts on error) as a login shell (so the profile is
      # sourced and node/npm/npx are on PATH).
      - name: Deploy over SSH
        env:
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.HETZNER_SSH_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" < deploy/hetzner-deploy.sh
