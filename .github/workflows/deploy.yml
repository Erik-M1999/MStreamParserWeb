name: Deploy to Hetzner

# Deploys on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; a newer push supersedes an in-flight one.
concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Password-based SSH to konsoleH via sshpass — no marketplace action, so
      # nothing new enters the supply chain. The remote build script is streamed
      # to a login shell (bash -l) so the server's PATH (node/npm/npx) is set up.
      - name: Deploy over SSH
        env:
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.HETZNER_SSH_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'bash -l -s' < deploy/hetzner-deploy.sh
