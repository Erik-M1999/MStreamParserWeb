# One-command start for the whole app (frontend + backend + database).
#
#   docker compose up --build # → http://127.0.0.1:3000
#
# App config + secrets are read from backend/.env (ONE source of truth, shared
# with `npm run dev`). That file is optional here: without it the app still boots
# — JWT_SECRET and TOKEN_ENC_KEY are auto-generated on first start (persisted in
# the msp_secrets volume), and the Spotify/Last.fm/email integrations simply stay
# off until their keys are present.
#
# The `app` container builds the static frontend + the Express API into one
# Node process and applies DB migrations on start; `db` is MariaDB.
#
# Local dev without Docker for the app: start just the database with
#   docker compose up -d db
# then run the backend/frontend dev servers as usual (backend/.env points at
# 127.0.0.1:3306). Production (Hetzner) uses its own DATABASE_URL.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Single source of truth for app config + secrets, shared with `npm run dev`.
    # required:false → the container still starts if the file is absent (the
    # entrypoint auto-generates the secrets; optional integrations stay off).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Docker-network / single-origin overrides — these WIN over env_file.
      NODE_ENV: production
      PORT: "3000"
      # In-network address of the db service (not 127.0.0.1); overrides any
      # DATABASE_URL in backend/.env so the app always uses the db service here.
      DATABASE_URL: "mysql://msp:msp_local_dev@db:3306/MStreamParserWeb"
      # Same origin as the app so OAuth redirect + cookies work on one port.
      FRONTEND_ORIGIN: "http://127.0.0.1:3000"
      SPOTIFY_REDIRECT_URI: "http://127.0.0.1:3000/api/auth/spotify/callback"
    ports:
      - "3000:3000"
    volumes:
      # Persists the auto-generated JWT_SECRET / TOKEN_ENC_KEY across restarts, so
      # sessions + encrypted Spotify tokens survive. Delete the volume to rotate.
      - msp_secrets:/app/backend/run

  db:
    image: mariadb:11.4
    container_name: msp-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: MStreamParserWeb
      MARIADB_USER: msp
      MARIADB_PASSWORD: msp_local_dev
      MARIADB_ROOT_PASSWORD: root_local_dev
    ports:
      - "3306:3306"
    volumes:
      - msp_db_data:/var/lib/mysql
      # Grants the dev user shadow-DB privileges on first init (for migrate dev).
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/01-grant.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  msp_db_data:
  msp_secrets:
